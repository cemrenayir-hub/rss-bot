name: Günlük RSS Akışı Oluştur

on:
  schedule:
    - cron: '0 6 * * *' # Her gün TSİ 09:00'da çalışır
  workflow_dispatch: # Manuel çalıştırma imkanı tanır

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Scriptini Çalıştır
        run: python main.py

      - name: GitHub Pages'e Deploy Et
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          destination_dir: .
