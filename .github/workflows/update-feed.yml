name: Regenerate RSS Feed

# Runs daily and on-demand
on:
  schedule:
    - cron: '0 6 * * *'  # every day at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run feed generator
        run: |
          python -u main.py --debug

      - name: Commit and push generated feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gunluk_haberler.xml || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate RSS feed (scheduled)\n\nCo-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
