<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Günlük Haberler</title>
  <style>
    :root{--bg:#f6f7f9;--card:#ffffff;--muted:#6b7280;--accent:#2aa876}
    html,body{height:100%}
    body{font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:#111}
    header{padding:18px 24px;background:#fff;border-bottom:1px solid #e6e6e6}
    main{max-width:980px;margin:20px auto;padding:0 16px}
    h1{margin:0;font-size:20px;font-weight:600}
    #last-updated{margin-top:6px;color:var(--muted);font-size:0.9rem}
    #feed{margin-top:18px}
    .item{background:var(--card);border-radius:6px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(16,24,40,0.03);display:flex;gap:12px}
    .accent{width:6px;border-radius:3px;background:linear-gradient(180deg,var(--accent),#1f8f63)}
    .content{flex:1}
    .title{font-size:15px;margin:0 0 6px 0}
    .title a{color:#0f172a;text-decoration:none}
    .meta{color:var(--muted);font-size:0.85rem;margin-bottom:8px}
    .source{display:inline-block;background:#eefdf6;color:var(--accent);padding:4px 8px;border-radius:999px;font-size:12px;margin-right:8px}
    .excerpt{color:#374151;font-size:0.95rem}

    @media (max-width:640px){ main{padding:0 12px} .item{padding:12px} }
  </style>
</head>
<body>
  <h1>Günlük Özel Haber Özeti</h1>
  <div id="feed">Yükleniyor…</div>

  <script>
    const REFRESH_MS = 30 * 60 * 1000; // 30 minutes
    const container = document.getElementById('feed');

    // create filter controls
    const controls = document.createElement('div');
    controls.style.margin = '12px 0';
    controls.innerHTML = `
      <label style="font-size:0.95rem;color:var(--muted);">Filtre: </label>
      <select id="keyword-filter" style="margin-left:8px;padding:6px;border-radius:6px;border:1px solid #e6e6e6"></select>
    `;
    const header = document.querySelector('h1');
    header.insertAdjacentElement('afterend', controls);

    function renderItems(items, keywordFilter){
      container.innerHTML = '';
      const filtered = keywordFilter ? items.filter(it=>{
        const title = it.getElementsByTagName('title')[0]?.textContent || '';
        return title.includes('['+keywordFilter+']');
      }) : items;

      filtered.forEach(it=>{
        const title = it.getElementsByTagName('title')[0]?.textContent || 'No title';
        const link = it.getElementsByTagName('link')[0]?.textContent || '#';
        const desc = it.getElementsByTagName('description')[0]?.textContent || '';
        const pub = it.getElementsByTagName('pubDate')[0]?.textContent || '';
        // derive source from link hostname
        let source = '';
        try{ source = new URL(link).hostname.replace(/^www\./,''); }catch(e){ source = '' }
        // decode HTML entities in description and make a short excerpt
        const decodedDesc = new DOMParser().parseFromString(desc,'text/html').body.textContent || '';
        const excerpt = decodedDesc.length>240 ? decodedDesc.slice(0,240)+'…' : decodedDesc;

        const el = document.createElement('div'); el.className='item';
        el.innerHTML = `
          <div class="accent" aria-hidden></div>
          <div class="content">
            <div class="meta"><span class="source">${source}</span><span>${pub}</span></div>
            <h3 class="title"><a href="${link}" target="_blank">${title}</a></h3>
            <div class="excerpt">${excerpt}</div>
          </div>`;
        container.appendChild(el);
      });
      const now = new Date();
      const stamp = document.getElementById('last-updated');
      if (stamp) stamp.textContent = 'Güncellendi: ' + now.toLocaleString();
    }

    function populateFilter(items){
      const sel = document.getElementById('keyword-filter');
      sel.innerHTML = '';
      const optAll = document.createElement('option'); optAll.value = ''; optAll.textContent = 'Tümü'; sel.appendChild(optAll);
      const keys = new Set();
      const re = /^\[([^\]]+)\]/;
      items.forEach(it=>{
        const title = it.getElementsByTagName('title')[0]?.textContent || '';
        const m = title.match(re);
        if (m && m[1]) keys.add(m[1]);
      });
      Array.from(keys).sort().forEach(k=>{
        const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o);
      });
      sel.addEventListener('change',()=>{
        const v = sel.value;
        loadAndRender(v);
      });
    }

    async function loadFeedRaw(){
      const res = await fetch('gunluk_haberler.xml', {cache: 'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text,'application/xml');
      return Array.from(doc.getElementsByTagName('item'));
    }

    async function loadAndRender(filter){
      try{
        const items = await loadFeedRaw();
        if(!items.length){ container.textContent = 'No items'; return; }
        renderItems(items, filter);
      }catch(e){ container.textContent = 'Yükleme hatası: '+e.message }
    }

    // Add last-updated element
    const stamp = document.createElement('div');
    stamp.id = 'last-updated';
    stamp.className = 'meta';
    stamp.style.marginBottom = '12px';
    controls.insertAdjacentElement('afterend', stamp);

    // Initial load and periodic refresh
    loadFeedRaw().then(items=>{ populateFilter(items); renderItems(items); }).catch(e=>{ container.textContent = 'Yükleme hatası: '+e.message });
    setInterval(()=>{ loadFeedRaw().then(items=>{ const sel = document.getElementById('keyword-filter'); const v = sel ? sel.value : ''; renderItems(items, v); }).catch(e=>{ container.textContent = 'Yükleme hatası: '+e.message }); }, REFRESH_MS);
  </script>
</body>
</html>
