<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Günlük Haberler</title>
  <style>
    body{font-family:Segoe UI,Arial;margin:24px;color:#222}
    h1{margin-bottom:8px}
    .item{margin:12px 0;padding:8px;border-bottom:1px solid #eee}
    .meta{color:#666;font-size:0.9em}
  </style>
</head>
<body>
  <h1>Günlük Özel Haber Özeti</h1>
  <div id="feed">Yükleniyor…</div>

  <script>
    async function loadFeed(){
      try{
        const res = await fetch('gunluk_haberler.xml');
        const text = await res.text();
        const doc = new DOMParser().parseFromString(text,'application/xml');
        const items = Array.from(doc.getElementsByTagName('item'));
        const container = document.getElementById('feed');
        if(!items.length){ container.textContent = 'No items'; return; }
        container.innerHTML = '';
        items.slice(0,30).forEach(it=>{
          const title = it.getElementsByTagName('title')[0]?.textContent || 'No title';
          const link = it.getElementsByTagName('link')[0]?.textContent || '#';
          const desc = it.getElementsByTagName('description')[0]?.textContent || '';
          const pub = it.getElementsByTagName('pubDate')[0]?.textContent || '';
          const el = document.createElement('div'); el.className='item';
          el.innerHTML = `<a href="${link}" target="_blank"><strong>${title}</strong></a>
                          <div class="meta">${pub}</div>
                          <div class="desc">${desc}</div>`;
          container.appendChild(el);
        });
      }catch(e){ document.getElementById('feed').textContent = 'Yükleme hatası: '+e.message }
    }
    loadFeed();
  </script>
</body>
</html>
