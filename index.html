<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ekoloji Haber Servisi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f7f9; --card:#ffffff; --muted:#6b7280; --text:#0b1220; --muted-2:#9aa0a6
    }
    html,body{height:100%}
    body{font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif;margin:16px;background:var(--bg);color:var(--text);line-height:1.45}
    .app{max-width:900px;margin:6px auto}
    h1{font-size:20px;margin:6px 0;font-weight:600}
    #last-updated{margin:6px 0;color:var(--muted);font-size:13px}
    #feed{margin-top:12px}

    .item{background:var(--card);padding:10px 12px;margin:8px 0;display:flex;align-items:flex-start;gap:12px;border-radius:8px;box-shadow:0 1px 3px rgba(16,24,40,0.04);border:1px solid rgba(16,24,40,0.03)}
    .accent{width:6px;height:56px;border-radius:6px;flex-shrink:0}
    .content{flex:1}
    .title{font-size:15px;margin:0 0 6px 0}
    .title a{color:var(--text);text-decoration:none}
    .meta{color:var(--muted);font-size:12px}
    .source{display:inline-block;padding:4px 8px;border-radius:12px;font-size:12px;margin-right:8px}

    #controls{display:flex;align-items:center;gap:12px;margin:10px 0}
    #category-stats span{opacity:0.95}

    /* dark mode */
    body.dark{ --bg:#0b1220; --card:#07101a; --muted:#94a3b8; --text:#e6eef8 }
    body.dark .item{box-shadow:0 2px 8px rgba(2,6,23,0.5);border:1px solid rgba(255,255,255,0.03)}

    @media (max-width:640px){ body{margin:10px} .item{padding:8px} }
  </style>
</head>
<body>
  <h1>Ekoloji Haber Servisi</h1>
  <div id="feed">Yükleniyor…</div>

  <script>
    const REFRESH_MS = 15 * 60 * 1000; // 15 minutes
    const container = document.getElementById('feed');

    // create filter controls
    const controls = document.createElement('div');
    controls.id = 'controls';
    controls.style.margin = '12px 0';
    controls.innerHTML = `
      <label style="font-size:0.95rem;color:var(--muted);">Kategori: </label>
      <select id="category-filter" style="margin-left:8px;padding:8px;border-radius:8px;border:1px solid rgba(16,24,40,0.05);background:var(--card)"></select>
      <button id="dark-toggle" style="margin-left:8px;padding:8px;border-radius:8px;border:1px solid rgba(16,24,40,0.05);background:transparent;cursor:pointer">Karanlık</button>
    `;
    const header = document.querySelector('h1');
    header.insertAdjacentElement('afterend', controls);

    // dark mode toggle
    const darkToggle = controls.querySelector('#dark-toggle');
    darkToggle.addEventListener('click', ()=>{
      document.body.classList.toggle('dark');
      darkToggle.textContent = document.body.classList.contains('dark') ? 'Açık' : 'Karanlık';
    });

    function colorForKeyword(k){
      // deterministic hue from string
      if(!k) return {accent:'#ddd',bg:'#f6f6f6',text:'#111'};
      let h=0; for(let i=0;i<k.length;i++){ h = (h*31 + k.charCodeAt(i)) % 360; }
      const hue = h;
      const accent = `hsl(${hue} 70% 45%)`;
      const badgeBg = `hsl(${hue} 90% 94%)`;
      const badgeText = `hsl(${hue} 60% 25%)`;
      return {accent,bg:badgeBg,text:badgeText};
    }

    function renderItems(items, keywordFilter){
      container.innerHTML = '';
      const tagRe = /^\[([^\]]+)\]/;
      const filtered = keywordFilter ? items.filter(it=>{
        const title = (it.getElementsByTagName('title')[0]?.textContent || '').normalize('NFC');
        const m = title.match(tagRe);
        return m && m[1] === keywordFilter;
      }) : items;

      filtered.forEach(it=>{
        const title = it.getElementsByTagName('title')[0]?.textContent || 'No title';
        const link = it.getElementsByTagName('link')[0]?.textContent || '#';
        const pub = it.getElementsByTagName('pubDate')[0]?.textContent || '';
        // derive keyword from title tag like [Keyword]
        const kwMatch = title.match(/^\[([^\]]+)\]/);
        const kw = kwMatch ? kwMatch[1] : '';
        const colors = colorForKeyword(kw);

        const el = document.createElement('div'); el.className='item';
        el.innerHTML = `
          <div class="accent" aria-hidden style="background:${colors.accent}"></div>
          <div class="content">
            <div class="meta"><span class="source" style="background:${colors.bg};color:${colors.text}">${kw || ''}</span><span style="margin-left:8px">${pub}</span></div>
            <h3 class="title"><a href="${link}" target="_blank">${title.replace(/^\[[^\]]+\]\s*/,'')}</a></h3>
          </div>`;
        container.appendChild(el);
      });
      const now = new Date();
      const stamp = document.getElementById('last-updated');
      if (stamp) stamp.textContent = 'Güncellendi: ' + now.toLocaleString();
    }

    function populateFilter(items){
      const sel = document.getElementById('category-filter');
      sel.innerHTML = '';
      const optAll = document.createElement('option'); optAll.value = ''; optAll.textContent = 'Tümü'; sel.appendChild(optAll);
      const counts = {};
      const re = /^\[([^\]]+)\]/;
      items.forEach(it=>{
        const title = it.getElementsByTagName('title')[0]?.textContent || '';
        const m = title.match(re);
        const k = (m && m[1]) ? m[1] : '(none)';
        counts[k] = (counts[k] || 0) + 1;
      });
      Object.keys(counts).sort().forEach(k=>{
        const o = document.createElement('option'); o.value = k; o.textContent = `${k} (${counts[k]})`; sel.appendChild(o);
      });

      // Populate small stats panel if present
      const stats = document.getElementById('category-stats');
      if (stats){
        stats.innerHTML = '';
        Object.keys(counts).sort().forEach(k=>{
          const colors = colorForKeyword(k);
          const span = document.createElement('span');
          span.style.display = 'inline-block';
          span.style.marginRight = '8px';
          span.style.padding = '4px 8px';
          span.style.borderRadius = '12px';
          span.style.background = colors.bg;
          span.style.color = colors.text;
          span.textContent = `${k} (${counts[k]})`;
          stats.appendChild(span);
        });
      }

      sel.addEventListener('change',()=>{
        const v = sel.value;
        loadAndRender(v);
      });
    }

    async function loadFeedRaw(){
      const res = await fetch('gunluk_haberler.xml', {cache: 'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text,'application/xml');
      return Array.from(doc.getElementsByTagName('item'));
    }

    async function loadAndRender(filter){
      try{
        const items = await loadFeedRaw();
        if(!items.length){ container.textContent = 'No items'; console.warn('feed had no items'); return; }
        renderItems(items, filter);
      }catch(e){ console.error('loadAndRender error', e); container.textContent = 'Yükleme hatası: '+e.message; }
    }

    // Add small stats panel and last-updated element
    const statsDiv = document.createElement('div');
    statsDiv.id = 'category-stats';
    statsDiv.style.margin = '8px 0 6px 0';
    controls.insertAdjacentElement('afterend', statsDiv);

    const stamp = document.createElement('div');
    stamp.id = 'last-updated';
    stamp.className = 'meta';
    stamp.style.marginBottom = '12px';
    statsDiv.insertAdjacentElement('afterend', stamp);

    // Initial load and periodic refresh
    loadFeedRaw().then(items=>{ populateFilter(items); renderItems(items); }).catch(e=>{ console.error('initial load failed', e); container.textContent = 'Yükleme hatası: '+e.message });
    setInterval(()=>{ const sel = document.getElementById('category-filter'); const v = sel ? sel.value : ''; loadAndRender(v).catch(e=>{ console.error('refresh failed', e); container.textContent = 'Yükleme hatası: '+e.message; }); }, REFRESH_MS);
  </script>
</body>
</html>
